<div class="widget game-widget" id="gameWidget" style="display:none">
<div class="widget-title" data-i18n="game">小游戏</div>
<span class="game-badge" data-i18n="gameNew">新</span>
<canvas id="gameCanvas" style="width:100%;max-width:600px;display:block;border-radius:var(--radius-xs)"></canvas>
<div class="game-carousel">
<button class="game-carousel-btn" id="gamePrev">◂</button>
<span class="game-carousel-label" id="gameName"></span>
<button class="game-carousel-btn" id="gameNext">▸</button>
</div>
<div id="gameScore" style="text-align:center;font-size:13px;color:var(--text-dim);margin-top:4px"></div>
</div>
