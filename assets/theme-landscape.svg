<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Minimal landscape wallpaper</title>
  <desc id="desc">A quiet 16:9 minimalist animated landscape with a central dark mountain, side mountains, a soft sun, and still water.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop id="skyTop" offset="0" stop-color="#d9eef0"/>
      <stop id="skyMid" offset="0.48" stop-color="#f3ded0"/>
      <stop id="skyBottom" offset="1" stop-color="#e7c4aa"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff0bf" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#f5b77e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f5b77e" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="farHills" x1="0" y1="0" x2="0" y2="1">
      <stop id="farHillTop" offset="0" stop-color="#8eb3b1"/>
      <stop id="farHillBottom" offset="1" stop-color="#739b9a"/>
    </linearGradient>

    <linearGradient id="nearHills" x1="0" y1="0" x2="0" y2="1">
      <stop id="nearHillTop" offset="0" stop-color="#547a7b"/>
      <stop id="nearHillBottom" offset="1" stop-color="#365f63"/>
    </linearGradient>

    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop id="lakeTop" offset="0" stop-color="#b7d1ce"/>
      <stop id="lakeMid" offset="0.5" stop-color="#9fbbb9"/>
      <stop id="lakeBottom" offset="1" stop-color="#6e8f91"/>
    </linearGradient>

    <linearGradient id="foreground" x1="0" y1="0" x2="0" y2="1">
      <stop id="foregroundTop" offset="0" stop-color="#274c4f"/>
      <stop id="foregroundBottom" offset="1" stop-color="#17383b"/>
    </linearGradient>

    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="fineGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>

    <clipPath id="horizonClip">
      <rect x="0" y="0" width="1920" height="1080" rx="0"/>
    </clipPath>

    <filter id="uiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#15363a" flood-opacity="0.18"/>
    </filter>

    <style>
      .dial { cursor: pointer; user-select: none; }
      .dial text { font-family: Inter, Segoe UI, Arial, sans-serif; letter-spacing: 0; pointer-events: none; }
      .dial-track { fill: none; stroke: rgba(255,255,255,0.3); stroke-width: 12; }
      .dial-progress { fill: none; stroke: rgba(255,255,255,0.82); stroke-width: 12; stroke-linecap: round; }
      .dial-knob { fill: #ffffff; stroke: rgba(31,68,71,0.28); stroke-width: 3; }
      .weather-button { cursor: pointer; }
      .weather-button rect { fill: rgba(22,52,55,0.22); stroke: rgba(255,255,255,0.28); stroke-width: 1.5; }
      .weather-button text { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; fill: rgba(255,255,255,0.82); letter-spacing: 0; pointer-events: none; }
      .weather-button.active rect { fill: rgba(255,255,255,0.26); stroke: rgba(255,255,255,0.78); }
      .weather-button.active text { fill: #ffffff; }
    </style>
  </defs>

  <g clip-path="url(#horizonClip)">
    <rect width="1920" height="1080" fill="url(#sky)"/>

    <g id="sunHalo" opacity="0.72">
      <circle id="sunHalo4" cx="960" cy="358" r="285" fill="#f4a98b" opacity="0.12">
        <animate attributeName="opacity" values="0.1;0.16;0.1" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle id="sunHalo3" cx="960" cy="358" r="232" fill="#f2c391" opacity="0.18">
        <animate attributeName="opacity" values="0.14;0.24;0.14" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle id="sunHalo2" cx="960" cy="358" r="180" fill="#f6d9a0" opacity="0.22">
        <animate attributeName="opacity" values="0.18;0.3;0.18" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle id="sunHalo1" cx="960" cy="358" r="128" fill="#ffe7ac" opacity="0.3">
        <animate attributeName="opacity" values="0.24;0.36;0.24" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle id="sunCore" cx="960" cy="358" r="86" fill="#ffe7ac" opacity="0.96"/>

    <g id="clouds" opacity="0.28" filter="url(#soften)"/>

    <path id="farMountain" d="M0 570Q125 540 250 510Q335 525 420 540Q515 514 610 488Q705 525 800 562Q880 560 960 558Q1040 560 1120 562Q1215 525 1310 488Q1405 514 1500 540Q1585 525 1670 510Q1795 540 1920 570V698H0Z" fill="url(#farHills)" opacity="0.76"/>
    <path id="sideMountain" d="M0 632Q120 600 240 570Q332 590 425 610Q520 579 615 548Q698 586 780 625Q870 630 960 635Q1050 630 1140 625Q1222 586 1305 548Q1400 579 1495 610Q1588 590 1680 570Q1800 600 1920 632V744H0Z" fill="#668e8e" opacity="0.5"/>
    <path id="mainMountain" d="M0 704Q130 672 260 640Q345 662 430 684Q525 626 620 568Q690 612 760 655Q825 578 890 505Q925 462 960 440Q995 462 1030 505Q1095 578 1160 655Q1230 612 1300 568Q1395 626 1490 684Q1575 662 1660 640Q1790 672 1920 704V795H0Z" fill="url(#nearHills)"/>
    <g id="snowCap" fill="#f7fbff" opacity="0">
      <path d="M890 505Q925 462 960 440Q995 462 1030 505L1000 498L960 488L920 498Z"/>
      <path d="M575 594Q598 581 620 568Q655 590 690 612L645 600L608 590Z"/>
      <path d="M1230 612Q1265 590 1300 568Q1322 581 1345 594L1312 590L1275 600Z"/>
      <path d="M720 630Q740 642 760 655Q783 628 806 602L785 636L750 642Z"/>
      <path d="M1114 602Q1137 628 1160 655Q1180 642 1200 630L1170 642L1135 636Z"/>
    </g>

    <rect id="lakeRect" x="0" y="690" width="1920" height="390" fill="url(#lake)"/>
    <g id="waterFlow" fill="none" stroke="#e6f6f0" stroke-linecap="round" opacity="0.34">
      <path d="M-220 760C80 728 318 786 620 758S1168 730 1490 758S1900 790 2140 754" stroke-width="3" stroke-dasharray="82 150" opacity="0.36">
        <animate attributeName="stroke-dashoffset" from="0" to="-232" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.22;0.42;0.22" dur="8s" repeatCount="indefinite"/>
      </path>
      <path d="M-160 835C120 810 355 858 660 832S1215 806 1505 834S1870 856 2080 826" stroke-width="2" stroke-dasharray="64 130" opacity="0.28">
        <animate attributeName="stroke-dashoffset" from="0" to="-194" dur="13s" repeatCount="indefinite"/>
      </path>
      <path d="M-260 910C20 884 300 932 590 906S1125 880 1400 906S1815 934 2180 900" stroke-width="2" stroke-dasharray="48 116" opacity="0.22">
        <animate attributeName="stroke-dashoffset" from="0" to="-164" dur="15s" repeatCount="indefinite"/>
      </path>
    </g>
    <path id="horizonMist" d="M0 689C230 706 375 674 575 690C785 706 970 676 1195 694C1422 712 1632 681 1920 697V742C1650 725 1426 754 1190 735C970 718 770 750 560 730C354 711 212 741 0 722Z" fill="#d7e4df" opacity="0.32">
      <animateTransform attributeName="transform" type="translate" values="-18 0;18 0;-18 0" dur="14s" repeatCount="indefinite"/>
    </path>

    <g id="ripples" opacity="0.22">
      <animate attributeName="opacity" values="0.16;0.28;0.16" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="16 0;-16 0;16 0" dur="16s" repeatCount="indefinite"/>
      <path d="M0 810C185 790 321 816 492 798C690 777 842 820 1015 800C1225 775 1374 820 1552 802C1715 785 1810 806 1920 792" fill="none" stroke="#ffffff" stroke-width="3"/>
      <path d="M0 874C214 852 346 885 548 863C756 841 938 884 1148 862C1382 837 1532 884 1725 862C1810 852 1870 854 1920 846" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>

    <g id="seasonDots" opacity="0">
      <circle cx="386" cy="686" r="7" fill="#f4c6cf"/>
      <circle cx="520" cy="696" r="5" fill="#f4d5b6"/>
      <circle cx="1365" cy="688" r="6" fill="#f0b78b"/>
      <circle cx="1515" cy="696" r="5" fill="#f4c6cf"/>
      <circle cx="1220" cy="700" r="4" fill="#e0e8a8"/>
    </g>

    <path id="foregroundLand" d="M0 968C178 920 350 932 522 960C694 988 818 1015 995 980C1194 941 1332 930 1510 960C1660 986 1770 1015 1920 966V1080H0Z" fill="url(#foreground)"/>

    <rect width="1920" height="1080" filter="url(#fineGrain)" opacity="0.5"/>
    <rect id="weatherDim" width="1920" height="1080" fill="#455d68" opacity="0"/>
    <g id="weatherLayer" pointer-events="none"/>

    <g id="controls" filter="url(#uiShadow)" opacity="0.88">
      <g id="seasonDial" class="dial" transform="translate(1630 865)" data-control="season">
        <circle r="82" fill="rgba(22,52,55,0.2)"/>
        <circle class="dial-track" r="62"/>
        <path id="seasonArc" class="dial-progress"/>
        <circle id="seasonKnob" class="dial-knob" r="12"/>
        <text id="seasonValue" y="-6" text-anchor="middle" font-size="28" fill="#ffffff">Spring</text>
        <text y="24" text-anchor="middle" font-size="15" fill="rgba(255,255,255,0.78)">season 360</text>
      </g>
      <g id="timeDial" class="dial" transform="translate(1800 865)" data-control="time">
        <circle r="82" fill="rgba(22,52,55,0.2)"/>
        <circle class="dial-track" r="62"/>
        <path id="timeArc" class="dial-progress"/>
        <circle id="timeKnob" class="dial-knob" r="12"/>
        <text id="timeValue" y="-6" text-anchor="middle" font-size="28" fill="#ffffff">Morning</text>
        <text y="24" text-anchor="middle" font-size="15" fill="rgba(255,255,255,0.78)">time 360</text>
      </g>
      <g id="weatherControl" transform="translate(1375 972)">
        <g id="weatherClear" class="weather-button active" data-weather="clear" transform="translate(0 0)">
          <rect width="112" height="48" rx="8"/>
          <text x="56" y="30" text-anchor="middle">clear</text>
        </g>
        <g id="weatherRain" class="weather-button" data-weather="rain" transform="translate(124 0)">
          <rect width="112" height="48" rx="8"/>
          <text x="56" y="30" text-anchor="middle">rain</text>
        </g>
        <g id="weatherSnow" class="weather-button" data-weather="snow" transform="translate(248 0)">
          <rect width="112" height="48" rx="8"/>
          <text x="56" y="30" text-anchor="middle">snow</text>
        </g>
        <g id="weatherCloudy" class="weather-button" data-weather="cloudy" transform="translate(372 0)">
          <rect width="112" height="48" rx="8"/>
          <text x="56" y="30" text-anchor="middle">cloudy</text>
        </g>
      </g>
    </g>
  </g>

</svg>
